<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>관리자</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#112147;--sub:#56617b;--line:#dde3ef;--pt:#d8362b;--bar:#2a4fa8}
@media(prefers-color-scheme:dark){:root{--bg:#0d1324;--card:#151e36;--ink:#eef1f8;--sub:#9aa5c4;--line:#26314f;--bar:#6f93f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans KR',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--sub);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;white-space:nowrap}
.bar{height:10px;background:var(--bar);border-radius:5px;min-width:2px}
button,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button{background:var(--card);color:var(--ink);border-color:var(--line);margin-right:6px}.tabs button.on{background:var(--ink);color:var(--bg)}
.sub{color:var(--sub);font-size:13px}a{color:var(--bar)}
#login{max-width:340px;margin:18vh auto;text-align:center}#login input{width:100%;margin:10px 0}
.err{color:#c0392b}
</style></head><body><main>
<div id="login" class="card" hidden><h1>관리자 로그인</h1><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="go" style="width:100%">들어가기</button><p id="msg" class="err"></p></div>
<div id="app" hidden>
<h1>류상 아카데미 관리자 <button id="out" style="float:right;font-size:13px;padding:6px 10px">나가기</button></h1>
<div class="tabs" style="margin-bottom:12px"><button data-d="1" class="on">오늘</button><button data-d="7">7일</button><button data-d="30">30일</button><button data-d="0">전체</button></div>
<div class="kpi" id="kpi"></div><p class="sub" id="note"></p>
<div class="card"><h2>퀴즈 단계별 이탈 (방문자 수)</h2><div id="funnel"></div></div>
<div class="card"><h2>카톡 상담 클릭</h2><div id="kk"></div></div>
<div class="card"><h2>많이 본 페이지</h2><div id="pages"></div></div>
<div class="card"><h2>많이 누른 메뉴</h2><div id="menus"></div></div>
<div class="card"><h2>시간대 / 지역(시·도) / 브라우저</h2><div id="hours"></div><div id="regs" style="margin-top:14px"></div><div id="brs" style="margin-top:14px"></div></div>
<div class="card"><h2>퀴즈 결과 목록</h2><p><input id="q" placeholder="결과 번호(R-1234) 또는 결과 주소" style="width:min(320px,100%)"> <button id="sq">찾기</button></p><div id="found"></div><div id="rlist"></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KR={'11':'서울','26':'부산','27':'대구','28':'인천','29':'광주','30':'대전','31':'울산','50':'세종','41':'경기','42':'강원','43':'충북','44':'충남','45':'전북','46':'전남','47':'경북','48':'경남','49':'제주'};
const regName=r=>{const [c,g]=(r||'-').split('-');if(!c)return '알 수 없음';if(c!=='KR')return c+' (해외)';return KR[g]||('한국 '+(g||'?'))};
let D=null,days=1;
async function load(){
  const r=await fetch('/api/admin');
  if(r.status===401){$('login').hidden=false;$('app').hidden=true;return}
  if(!r.ok){$('login').hidden=false;$('msg').textContent=(await r.json().catch(()=>({}))).error==='db-not-configured'?'저장소가 아직 연결되지 않았습니다.':'불러오기 오류';return}
  D=await r.json();$('login').hidden=true;$('app').hidden=false;draw();
}
function bars(rows,total){const m=Math.max(1,...rows.map(r=>r[1]));return '<table>'+rows.map(r=>`<tr><td>${esc(r[0])}</td><td style="width:50%"><div class="bar" style="width:${Math.round(r[1]/m*100)}%"></div></td><td>${r[1]}${total?` (${Math.round(r[1]/total*100)}%)`:''}</td></tr>`).join('')+'</table>'}
function uniq(a){return new Set(a.map(e=>e.vid)).size}
function draw(){
  const kst=t=>new Date(t+9*3600e3);
  const day0=(()=>{const n=kst(D.now);return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())-9*3600e3})();
  const from=days===0?0:(days===1?day0:day0-(days-1)*86400e3);
  const ev=D.events.filter(e=>e.t>=from),by=k=>ev.filter(e=>e.e===k);
  const pv=by('pv'),qs=by('quiz_start'),qd=by('quiz_done'),kk=by('kakao_click');
  const qsV=uniq(qs),qdV=uniq(qd),kkV=uniq(kk);
  $('kpi').innerHTML=[['방문자 수',uniq(pv)],['페이지 조회',pv.length],['퀴즈 시작',qsV],['퀴즈 완료',qdV],['카톡 상담 클릭',kkV],['클릭 전환율',qdV?Math.round(kkV/qdV*100)+'%':'-']].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  $('note').textContent='방문자 수는 무작위 방문자 번호 기준(같은 기기·브라우저는 한 명으로 셉니다). 전환율 = 카톡 상담을 누른 사람 ÷ 퀴즈를 끝낸 사람.'+(D.events.length>=29999?' 기록이 가득 차 오래된 것부터 지워지고 있습니다.':'');
  const steps=[['퀴즈 시작',qsV]];for(let i=1;i<=10;i++)steps.push([i+'번 문항',uniq(ev.filter(e=>e.e==='quiz_step'&&e.s===i))]);steps.push(['결과 보기',qdV],['카톡 상담 클릭',kkV]);
  $('funnel').innerHTML=bars(steps,qsV);
  const kv=kk.length;$('kk').innerHTML=`<p style="margin:0">클릭 ${kv}회 (${kkV}명) · 퀴즈 완료 ${qdV}명 중 ${qdV?Math.round(kkV/qdV*100):0}%</p>`+bars(Object.entries(kk.reduce((a,e)=>{const k=e.p+(e.rid?' (결과 번호 있음)':'');a[k]=(a[k]||0)+1;return a},{})).sort((a,b)=>b[1]-a[1]).slice(0,8));
  const cnt=(a,f)=>Object.entries(a.reduce((o,e)=>{const k=f(e);if(k)o[k]=(o[k]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]);
  $('pages').innerHTML=bars(cnt(pv,e=>e.p).slice(0,10));
  const mn=cnt(by('menu'),e=>e.m).slice(0,10);$('menus').innerHTML=mn.length?bars(mn):'<p class="sub">아직 없음</p>';
  const hr=Array.from({length:24},(_,h)=>[String(h).padStart(2,'0')+'시',0]);pv.forEach(e=>hr[kst(e.t).getUTCHours()][1]++);$('hours').innerHTML=bars(hr);
  $('regs').innerHTML='<b>지역</b>'+bars(cnt(pv,e=>regName(e.reg)).slice(0,10));
  $('brs').innerHTML='<b>브라우저</b>'+bars(cnt(pv,e=>e.br).slice(0,10));
  $('rlist').innerHTML=rtable(D.results.filter(r=>r.t>=from));
}
function rtable(rs){if(!rs.length)return '<p class="sub">이 기간 결과 없음</p>';
  return '<table><tr><th>번호</th><th>시각</th><th>결과</th><th>더 채울 곳</th><th>추천</th><th>지역</th><th>경로</th><th></th></tr>'+rs.map(r=>`<tr><td>${esc(r.num)}</td><td>${new Date(r.t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.total)}</td><td>${esc((r.weak||[]).join(', '))}</td><td>${esc(r.rec)}</td><td>${esc(regName(r.reg))}</td><td>${r.src==='ad'?'광고':'일반'}</td><td><a href="/r/${esc(r.id)}" target="_blank" rel="noopener">열기</a></td></tr>`).join('')+'</table>'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=+b.dataset.d;draw()});
$('go').onclick=async()=>{$('msg').textContent='';const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
  if(r.ok){$('pw').value='';load()}else{const e=await r.json().catch(()=>({}));$('msg').textContent=e.error==='no-password-set'?'비밀번호가 아직 설정되지 않았습니다.':'비밀번호가 맞지 않습니다.'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('out').onclick=async()=>{await fetch('/api/admin?out=1');location.reload()};
$('sq').onclick=async()=>{const q=$('q').value.trim();if(!q)return;const r=await fetch('/api/admin?q='+encodeURIComponent(q));const j=await r.json();
  $('found').innerHTML=j.result?'<p><b>찾은 결과</b></p>'+rtable([j.result]):'<p class="sub">찾지 못했습니다.</p>'};
$('q').onkeydown=e=>{if(e.key==='Enter')$('sq').click()};
load();
</script></body></html>
