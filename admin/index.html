<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>관리자</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#112147;--sub:#56617b;--line:#dde3ef;--pt:#d8362b;--bar:#2a4fa8;--ok:#1f8a4c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1324;--card:#151e36;--ink:#eef1f8;--sub:#9aa5c4;--line:#26314f;--bar:#6f93f0;--ok:#4cc98a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0}h2{font-size:18px;margin:22px 0 8px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}.live i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;min-height:46px;font-size:16px}
button,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.big{grid-template-columns:repeat(4,1fr)}}
.big div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.big b{display:block;font-size:40px;line-height:1.1}.big span{display:block;font-weight:700;margin-top:4px}.big small{color:var(--sub);font-size:13px;line-height:1.4;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.sub{color:var(--sub);font-size:14px}
.row{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:10px;align-items:center;margin:8px 0}
.row .t{background:var(--line);border-radius:6px;height:14px}.row .t i{display:block;height:100%;background:var(--bar);border-radius:6px}.row b{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top}th{color:var(--sub);font-weight:500;font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:0 14px}details summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none}details summary::before{content:'▸ '}details[open] summary::before{content:'▾ '}details>div{padding-bottom:14px;overflow-x:auto}
a{color:var(--bar)}.pill{display:inline-block;background:var(--line);border-radius:999px;padding:1px 10px;font-size:13px;margin:1px 2px 1px 0}
#login{max-width:340px;margin:18vh auto;text-align:center}#login input{width:100%;margin:10px 0}#login button{width:100%;background:var(--ink);color:var(--bg)}
.err{color:#c0392b}.find{display:flex;gap:8px;margin:8px 0}.find input{flex:1;min-width:0}
</style></head><body><main>
<div id="login" class="card" hidden><h1>관리자 로그인</h1><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="go">들어가기</button><p id="msg" class="err"></p></div>
<div id="app" hidden>
<div class="top"><h1>류상 아카데미 관리자</h1><span class="live"><i></i>지금 <span id="live">0</span>명 보는 중</span><button id="out" style="margin-left:auto;padding:6px 12px">나가기</button></div>
<div class="tabs"><button data-d="1" class="on">오늘</button><button data-d="7">최근 7일</button><button data-d="30">최근 30일</button><button data-d="0">전체</button></div>
<div class="big" id="big"></div>
<h2>손님이 어디까지 갔나요?</h2>
<div class="card"><div id="fun"></div><details style="border:0;padding:0;margin:6px 0 0"><summary class="sub" style="padding:6px 0">퀴즈 문항별로 자세히 보기</summary><div id="fun2"></div></details></div>
<h2>상담해 드릴 손님 <span class="sub" id="rcount"></span></h2>
<div class="find"><input id="q" placeholder="결과 번호 찾기 (예: R-1003)"><button id="sq">찾기</button></div>
<div id="found"></div>
<div class="card" id="rlist"></div>
<h2>더 자세히 보기</h2>
<details><summary>어느 페이지를 많이 봤나요?</summary><div id="pages"></div></details>
<details><summary>어느 메뉴를 많이 눌렀나요?</summary><div id="menus"></div></details>
<details><summary>몇 시에 많이 들어오나요?</summary><div id="hours"></div></details>
<details><summary>어느 지역(시·도)에서 들어오나요?</summary><div id="regs"></div></details>
<details><summary>무슨 기기·브라우저로 들어오나요?</summary><div id="brs"></div></details>
<details><summary>어디서 링크를 타고 왔나요?</summary><div id="refs"></div></details>
<details><summary>방금 있었던 일 (최근 100건)</summary><div id="evl"></div></details>
<p class="sub" id="note" style="margin-top:18px"></p>
</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KR={'11':'서울','26':'부산','27':'대구','28':'인천','29':'광주','30':'대전','31':'울산','50':'세종','41':'경기','42':'강원','43':'충북','44':'충남','45':'전북','46':'전남','47':'경북','48':'경남','49':'제주'};
const regName=r=>{const [c,g]=(r||'-').split('-');if(!c)return '알 수 없음';if(c!=='KR')return c+' (해외)';return KR[g]||('한국 '+(g||'?'))};
const NM={pv:'페이지 열어 봄',menu:'메뉴·링크 누름',quiz_start:'퀴즈 시작',quiz_step:'퀴즈 문항 봄',quiz_done:'퀴즈 끝(결과 나옴)',kakao_click:'카톡 상담 누름',result_view:'결과 주소 열어 봄'};
let D=null,days=1;
async function load(){
  const r=await fetch('/api/admin');
  if(r.status===401){$('login').hidden=false;$('app').hidden=true;return}
  if(!r.ok){$('login').hidden=false;$('app').hidden=true;$('msg').textContent=(await r.json().catch(()=>({}))).error==='db-not-configured'?'저장소가 아직 연결되지 않았습니다.':'불러오기 오류';return}
  D=await r.json();$('login').hidden=true;$('app').hidden=false;draw();
}
function bars(rows,suffix){if(!rows.length)return '<p class="sub">아직 없어요</p>';const m=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><div class="t"><i style="width:${Math.max(2,Math.round(r[1]/m*100))}%"></i></div><b>${r[1]}${suffix||''}</b></div>`).join('')}
const uniq=a=>new Set(a.map(e=>e.vid)).size;
const cnt=(a,f)=>Object.entries(a.reduce((o,e)=>{const k=f(e);if(k)o[k]=(o[k]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]);
function draw(){
  const kst=t=>new Date(t+9*3600e3);
  const n=kst(D.now);const day0=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())-9*3600e3;
  const from=days===0?0:(days===1?day0:day0-(days-1)*86400e3);
  const ev=D.events.filter(e=>e.t>=from),by=k=>ev.filter(e=>e.e===k);
  const pv=by('pv'),qs=by('quiz_start'),qd=by('quiz_done'),kk=by('kakao_click');
  const apV=uniq(by('menu').filter(e=>/^\/quiz/.test(e.m||'')));
  const V=uniq(pv),QS=uniq(qs),QD=uniq(qd),KK=uniq(kk);
  const label=days===1?'오늘':days===0?'전체':'최근 '+days+'일';
  $('live').textContent=D.live||0;
  $('big').innerHTML=[[V,label+' 방문한 사람','홈페이지에 들어온 사람 수'],[QD,'진단을 끝낸 사람','퀴즈 마지막 결과까지 본 사람'],[KK,'카톡 상담을 누른 사람','결과를 보고 상담 버튼을 누른 사람'],[QD?Math.round(KK/QD*100)+'%':'-','상담 연결률','진단을 끝낸 사람 중 카톡 상담을 누른 비율']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><small>${x[2]}</small></div>`).join('');
  const f5=[['홈페이지에 들어옴',V],['수강신청을 누름',apV],['퀴즈를 시작함',QS],['진단 결과까지 봄',QD],['카톡 상담을 누름',KK]];
  $('fun').innerHTML=bars(f5,'명')+'<p class="sub" style="margin:8px 0 0">같은 기기·브라우저는 한 명으로 셉니다. 앞 단계보다 숫자가 줄어든 곳이 손님이 나간 곳입니다.</p>';
  const steps=[];for(let i=1;i<=10;i++)steps.push([i+'번 문항까지 옴',uniq(ev.filter(e=>e.e==='quiz_step'&&e.s===i))]);$('fun2').innerHTML=bars(steps,'명');
  const rs=D.results.filter(r=>r.t>=from);$('rcount').textContent='('+rs.length+'명)';$('rlist').innerHTML=rtable(rs);
  $('pages').innerHTML=bars(cnt(pv,e=>e.p).slice(0,10),'회');
  $('menus').innerHTML=bars(cnt(by('menu'),e=>e.m).slice(0,10),'회');
  const hr=Array.from({length:24},(_,h)=>[String(h).padStart(2,'0')+'시',0]);pv.forEach(e=>hr[kst(e.t).getUTCHours()][1]++);$('hours').innerHTML=bars(hr,'회');
  $('regs').innerHTML=bars(cnt(pv,e=>regName(e.reg)).slice(0,12),'회');
  $('brs').innerHTML=bars(cnt(pv,e=>e.br).slice(0,10),'회');
  $('refs').innerHTML=bars(cnt(pv,e=>e.ref||'직접 입력·앱').slice(0,10),'회');
  $('evl').innerHTML=ev.length?'<table><tr><th>시간</th><th>한 일</th><th>어디서</th></tr>'+ev.slice(0,100).map(e=>`<tr><td>${new Date(e.t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(NM[e.e]||e.e)}${e.s?' '+e.s+'번':''} <span class="sub">${esc(e.m||e.p||'')}</span></td><td>${esc(regName(e.reg))} · ${esc(e.br)}</td></tr>`).join('')+'</table>':'<p class="sub">아직 없어요</p>';
  $('note').textContent='이름·전화번호·IP 주소는 저장하지 않습니다. 접속 기록은 최근 1만 건만 보관되고, 퀴즈 결과는 1년 뒤 지워집니다.'+(D.events.length>=9999?' (기록이 가득 차 오래된 것부터 지워지는 중)':'');
}
function rtable(rs){if(!rs.length)return '<p class="sub">이 기간에 퀴즈를 끝낸 손님이 아직 없어요</p>';
  return '<table><tr><th>번호</th><th>시각</th><th>내 연습 습관</th><th>먼저 채울 곳 / 추천 과정</th><th></th></tr>'+rs.map(r=>`<tr><td><b>${esc(r.num)}</b><br><span class="sub">${esc(regName(r.reg))}</span></td><td>${new Date(r.t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.total)}</td><td>${(r.weak||[]).map(w=>'<span class="pill">'+esc(w)+'</span>').join('')}<br><b>${esc(r.rec)}</b></td><td><a href="/r/${esc(r.id)}" target="_blank" rel="noopener">결과 보기</a><br><a href="#" data-qa="${esc(r.id)}">답변 보기</a><br><a href="#" data-del="${esc(r.id)}" data-num="${esc(r.num)}">지우기</a></td></tr>`).join('')+'</table>'}
document.addEventListener('click',async e=>{
  const qa=e.target.closest&&e.target.closest('[data-qa]');
  if(qa){e.preventDefault();const j=await (await fetch('/api/admin?q='+encodeURIComponent(qa.dataset.qa))).json();const r=j.result;
    $('found').innerHTML=r?'<div class="card"><b>'+esc(r.num)+' 손님의 답변</b>'+(r.qa&&r.qa.length?'<table>'+r.qa.map(x=>'<tr><td>'+esc(x[0])+'</td><td><b>'+esc(x[1])+'</b></td></tr>').join('')+'</table>':'<p class="sub">답변 내용이 저장되지 않은 결과예요</p>')+'<p class="sub">'+esc(r.recwhy||'')+'</p></div>':'<p class="sub">찾지 못했어요</p>';$('found').scrollIntoView({behavior:'smooth'});return}
  const d=e.target.closest&&e.target.closest('[data-del]');
  if(d){e.preventDefault();if(!confirm(d.dataset.num+' 결과를 완전히 지울까요? 되돌릴 수 없어요.'))return;const r=await fetch('/api/admin?del='+encodeURIComponent(d.dataset.del),{method:'POST'});if(r.ok){$('found').innerHTML='';load()}else alert('지우지 못했어요')}});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');days=+b.dataset.d;draw()});
$('go').onclick=async()=>{$('msg').textContent='';const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
  if(r.ok){$('pw').value='';load()}else{const e=await r.json().catch(()=>({}));$('msg').textContent=e.error==='no-password-set'?'비밀번호가 아직 설정되지 않았습니다.':e.error==='too-many'?'시도가 너무 많아요. 1시간 뒤에 다시 해 주세요.':'비밀번호가 맞지 않습니다.'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('out').onclick=async()=>{await fetch('/api/admin?out=1');location.reload()};
$('sq').onclick=async()=>{const q=$('q').value.trim();if(!q)return;const j=await (await fetch('/api/admin?q='+encodeURIComponent(q))).json();
  $('found').innerHTML=j.result?'<div class="card"><b>찾은 결과</b>'+rtable([j.result])+'</div>':'<p class="sub">찾지 못했어요</p>'};
$('q').onkeydown=e=>{if(e.key==='Enter')$('sq').click()};
setInterval(()=>{if(!$('app').hidden&&!document.hidden)load()},15000);
load();
</script></body></html>
